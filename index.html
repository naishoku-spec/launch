<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お弁当注文表</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body>
    <script>
        // Firebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyCeYbVUurF49w5P_iUx9XVa5oMx5P5G12k",
            authDomain: "lunch-order-8d785.firebaseapp.com",
            databaseURL: "https://lunch-order-8d785-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lunch-order-8d785",
            storageBucket: "lunch-order-8d785.firebasestorage.app",
            messagingSenderId: "846202375630",
            appId: "1:846202375630:web:2dc2f5e4f9648b4ba8af9f",
            measurementId: "G-94KNVCHZFM"
        };

        // 初期化（Configが入っている場合のみ）
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
        }
    </script>
    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <h1 class="title">お弁当注文表</h1>
            <div class="header-date-row">
                <div class="period-display" id="periodDisplay"></div>
                <!-- 本日の注文合計バナー（PC版のみ） -->
                <div class="today-total-wrapper" id="todayTotalWrapper">
                    <div class="today-total-banner" id="todayTotalBanner">
                        <span class="today-total-text" id="todayTotalText"></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- 注文表テーブル -->
        <div class="table-wrapper">
            <table class="order-table" id="orderTable">
                <thead id="tableHead">
                    <!-- JavaScriptで動的に生成 -->
                </thead>
                <tbody id="tableBody">
                    <!-- JavaScriptで動的に生成 -->
                </tbody>
                <tfoot id="tableFoot">
                    <!-- JavaScriptで動的に生成 -->
                </tfoot>
            </table>
        </div>

        <!-- 設定パネル -->
        <div class="settings-panel">
            <div class="settings-row">
                <div class="setting-group">
                    <label>表示月:</label>
                    <input type="month" id="monthSelector" class="month-input">
                </div>
                <div class="setting-group">
                    <label>会社負担分:</label>
                    <span class="yen-prefix">¥</span>
                    <input type="number" id="companyShare" class="amount-input" placeholder="0" min="0">
                </div>
                <div class="setting-group">
                    <label>個人負担分:</label>
                    <span class="yen-prefix">¥</span>
                    <input type="number" id="personalShare" class="amount-input" placeholder="0" min="0">
                </div>
                <div class="setting-group total-group">
                    <label>計:</label>
                    <span class="yen-prefix">¥</span>
                    <span id="totalPrice" class="total-price">0</span>
                </div>
            </div>
            <!-- ミノヤ設定行 -->
            <div class="settings-row"
                style="margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px;">
                <div class="setting-group">
                    <label style="color: #f97316; font-weight: 700;">ミノヤ(㋯)設定:</label>
                </div>
                <div class="setting-group">
                    <label>会社負担:</label>
                    <span class="yen-prefix">¥</span>
                    <input type="number" id="minoyaCompanyShare" class="amount-input" placeholder="0" min="0">
                </div>
                <div class="setting-group">
                    <label>個人負担:</label>
                    <span class="yen-prefix">¥</span>
                    <input type="number" id="minoyaPersonalShare" class="amount-input" placeholder="0" min="0">
                </div>
                <div class="setting-group total-group" style="background: #fff7ed;">
                    <label>計:</label>
                    <span class="yen-prefix">¥</span>
                    <span id="minoyaTotalPrice" class="total-price" style="color: #f97316;">0</span>
                </div>
            </div>
        </div>

        <!-- 社員管理 -->
        <div class="employee-management">
            <button id="addEmployeeBtn" class="btn btn-primary">
                <span class="btn-icon">+</span> 社員追加
            </button>
            <button id="manageEmployeesBtn" class="btn btn-secondary">
                社員管理
            </button>
            <button id="bulkOrderBtn" class="btn btn-info">
                <span class="btn-icon">✓</span> 一括入力
            </button>
            <button id="deleteOldDataBtn" class="btn btn-danger">
                <span class="btn-icon">🗑</span> 去年のデータを削除
            </button>
        </div>

        <!-- フッター注意書き -->
        <div class="notice">
            <p>当日、<strong>朝8時45分</strong>までに<br class="mobile-br"> 各自で <span class="circle-mark">○</span>印をしてください</p>
        </div>

        <!-- 保存状態表示 -->
        <div class="save-status" id="saveStatus">
            <span class="save-indicator"></span>
            <span class="save-text">自動保存済み</span>
        </div>
    </div>

    <!-- 社員追加モーダル -->
    <div class="modal" id="addEmployeeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>社員追加</h2>
                <button class="modal-close" id="closeAddModal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">名前を入力してください。<br>改行またはカンマで区切ると、複数人を一括で追加できます。</p>
                <label for="newEmployeeName">社員名:</label>
                <textarea id="newEmployeeName" class="text-input" style="height: 120px;"
                    placeholder="例：&#10;佐藤 太郎&#10;田中 花子"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelAddEmployee">キャンセル</button>
                <button class="btn btn-primary" id="confirmAddEmployee">追加</button>
            </div>
        </div>
    </div>

    <!-- 社員管理モーダル -->
    <div class="modal" id="manageEmployeesModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>社員管理</h2>
                <button class="modal-close" id="closeManageModal">&times;</button>
            </div>
            <div class="modal-body">
                <ul class="employee-list" id="employeeList">
                    <!-- JavaScriptで動的に生成 -->
                </ul>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="closeManageEmployees">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 一括入力モーダル -->
    <div class="modal" id="bulkOrderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>一括入力</h2>
                <button class="modal-close" id="closeBulkModal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">選択した社員の「全ての営業日」に<br>一括で記号を入力します。</p>
                <label for="bulkEmployeeSelect">社員を選択:</label>
                <select id="bulkEmployeeSelect" class="text-input">
                    <!-- JavaScriptで動的に生成 -->
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelBulkOrder" style="margin-right: auto;">キャンセル</button>
                <button class="btn btn-primary" id="confirmBulkCircle">一括 ◯</button>
                <button class="btn btn-danger" id="confirmBulkCross">一括 ×</button>
                <button class="btn" id="confirmBulkSpecial" style="background: #f97316; color: white;">一括 ㋯</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
